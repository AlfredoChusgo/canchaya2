<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanchaYa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #f0fdf4; color: #1e293b;
    }
    .card {
      text-align: center; padding: 2.5rem; max-width: 420px;
      background: #fff; border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .logo { font-size: 3rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.75rem; margin-bottom: .5rem; }
    p { color: #64748b; margin-bottom: 1.5rem; line-height: 1.5; }
    .btn {
      display: inline-block; padding: .875rem 2rem;
      background: #16a34a; color: #fff; border-radius: .5rem;
      text-decoration: none; font-weight: 600; font-size: 1rem;
      transition: background .2s;
    }
    .btn:hover { background: #15803d; }
    .secondary { display: block; margin-top: 1rem; color: #94a3b8; font-size: .875rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚽</div>
    <h1>CanchaYa</h1>
    <p>Abre este enlace en la app para ver los detalles del partido.</p>
    <a class="btn" id="openApp" href="#">Abrir en la app</a>
    <span class="secondary">¿No tienes la app? Contacta al organizador para más información.</span>
  </div>
  <script>
    (function () {
      var path = window.location.pathname.replace('/canchaya2', '') + window.location.search;
      var appUrl = 'canchaya://' + path.replace(/^\//, '');
      document.getElementById('openApp').href = appUrl;
      if (/android/i.test(navigator.userAgent)) {
        window.location.replace(appUrl);
      }
    })();
  </script>
</body>
</html>
